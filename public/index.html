<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridian Insights</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0b2a5c"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{--n:#0b2a5c;--b:#12408a;--l:#dde3ee;--g:#0f7b4f}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#0f1c33;font:15px/1.5 system-ui,Arial,sans-serif}
header{background:var(--n);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.logo{font-weight:700;font-size:18px}
main{max-width:980px;margin:0 auto;padding:18px 14px}.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px;margin-bottom:14px}
input{width:100%;padding:9px;border:1px solid var(--l);border-radius:6px;margin:4px 0 10px;font:inherit}button{background:var(--b);color:#fff;border:0;padding:9px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.big{font-size:24px;font-weight:700;color:var(--g)}iframe{width:100%;height:80vh;border:0;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--l);text-align:left}.m{color:#5b6b85;font-size:13px}</style></head><body>
<header><div class="logo">MERIDIAN Insights</div><div id="who"></div></header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),api=(p,b)=>fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json());
const e=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),$$=n=>"$"+Number(n).toFixed(2);
async function boot(){const m=await api("/api/me");if(m.error)return authView();
 $("#who").innerHTML=`${e(m.username||m.email)} · <b>${$$(m.balance)}</b>`;
 $("#app").innerHTML=`<div class="row"><div class="card"><span class="m">Balance</span><div class="big">${$$(m.balance)}</div></div><div class="card"><span class="m">Lifetime earned</span><div class="big">${$$(m.earned)}</div></div></div>
 <div class="card"><h2>Surveys</h2><p class="m">Rewards vary and are not guaranteed. Completions can be reversed by the survey partner. Payouts are reviewed manually and paid only after the partner confirms payment.</p><iframe src="${e(m.wall)}"></iframe></div>
 <div class="card"><h2>Withdraw</h2><div class="row"><div><input id="pp" placeholder="PayPal email"></div><div><input id="pa" type="number" placeholder="Amount (min 5)"></div></div><button onclick="wd()">Request payout</button> <span id="wm" class="m"></span>
 <table><tr><th>Amount</th><th>PayPal</th><th>Status</th></tr>${m.payouts.map(p=>`<tr><td>${$$(p.amount)}</td><td>${e(p.paypal)}</td><td>${e(p.status)}</td></tr>`).join("")}</table></div>
 <p class="m" style="text-align:center"><a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></p><div class="card"><h2>Recent earnings</h2><table><tr><th>Credited</th><th>Status</th></tr>${m.tx.map(t=>`<tr><td>${$$(t.credit)}</td><td>${e(t.status)}</td></tr>`).join("")}</table></div>`}
function authView(){$("#who").innerHTML="";$("#app").innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h2>Earn money for your opinions</h2><input id="em" placeholder="Username"><input id="pw" type="password" placeholder="Password (8+ chars)"><label class="m" style="display:block;margin-bottom:10px"><input type="checkbox" id="ag" style="width:auto;margin-right:6px">I am 18 or older and accept the <a href="/terms.html" target="_blank">Terms</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a> (needed to sign up)</label><button onclick="au('login')">Log in</button> <button onclick="au('signup')" style="background:#5b6b85">Sign up</button><p id="am" class="m"></p></div>`}
async function au(k){const r=await api("/api/"+k,{username:$("#em").value,password:$("#pw").value,agree:$("#ag").checked});r.error?$("#am").textContent=r.error:boot()}
async function wd(){const r=await api("/api/withdraw",{paypal:$("#pp").value,amount:$("#pa").value});r.error?$("#wm").textContent=r.error:boot()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
boot();</script></body></html>
